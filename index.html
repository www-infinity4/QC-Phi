<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC Phi</title><style>body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:20px}main{max-width:900px;margin:auto}.card{background:#1d1d1d;border:1px solid #444;border-radius:14px;padding:16px;margin:12px 0}button,input{padding:12px;border-radius:10px;margin:4px}button{font-weight:700}.wide{width:100%;box-sizing:border-box}textarea{width:100%;min-height:240px;background:#080808;color:#fff;border:1px solid #555;border-radius:10px;padding:10px;box-sizing:border-box}.pass{border-left:6px solid #35c46a}.fail{border-left:6px solid #ef5350}.unknown{border-left:6px solid #f5c542}</style></head><body><main><h1>QC Phi</h1><p>Observer and AI repair-ticket generator.</p><div class="card"><input id="url" class="wide" placeholder="Infinity Phi URL"><button onclick="run()">Run reachable checks</button><button onclick="tokenFailure()">Record search-token failure</button></div><div id="results"></div><h2>AI repair ticket</h2><textarea id="ticket" readonly></textarea><button onclick="copyTicket()">Copy ticket</button><script>
const results=document.getElementById('results'),ticket=document.getElementById('ticket');
function emit(x){const d=document.createElement('div');d.className='card '+x.status;d.textContent=x.contract+' — '+x.status.toUpperCase()+': '+x.observed;results.prepend(d);ticket.value=JSON.stringify(x,null,2)}
function base(id,expected,observed,status='fail'){return {schema:'qc-phi-ticket/v1',contract:id,system:'Infinity Phi',status,severity:'high',timestamp:new Date().toISOString(),expected,observed,instructions:['Verify this failure against the current deployed build before editing.','Trace the event from trigger through persistence to UI refresh.','Make the smallest repair that restores the contract.','Do not disconnect working Collect, Share, media handoff, feeds, navigation, or wallet behavior.','Rerun this contract and related regression checks after the change.']}}
function tokenFailure(){emit(base('infinity-search-token',['successful search creates one token transaction immediately','transaction persists in shared ledger','wallet tally refreshes immediately'],'Search succeeds but token is not being calculated/credited in the token wallet. Inspect search-success -> token mint/ledger -> wallet refresh handoff.'))}
async function run(){const u=document.getElementById('url').value.trim();if(!u)return;try{const r=await fetch(u,{cache:'no-store'});emit(base('infinity-reachability',['HTTP success from Infinity Phi'],'HTTP '+r.status,r.ok?'pass':'fail'))}catch(e){emit(base('infinity-reachability',['Infinity Phi reachable from browser'],String(e),'unknown'))}}
async function copyTicket(){await navigator.clipboard.writeText(ticket.value)}
</script></main></body></html>
