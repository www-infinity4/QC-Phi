<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC Phi</title>
<style>body{font-family:system-ui;background:#101014;color:#fff;margin:0;padding:18px}main{max-width:920px;margin:auto}.card{background:#1c1c23;border:1px solid #444;border-radius:15px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}button{padding:12px 15px;border:0;border-radius:10px;font-weight:800;margin:4px}textarea{width:100%;min-height:260px;background:#08080b;color:#fff;border:1px solid #555;border-radius:10px;padding:10px;box-sizing:border-box}.pass{border-left:6px solid #35c46a}.fail{border-left:6px solid #ef5350}.warn{border-left:6px solid #f5c542}.muted{color:#aaa}code{word-break:break-all}</style></head>
<body><main><h1>QC Phi</h1><p>Automatic observer for Infinity Phi. No address entry required.</p>
<div class="card"><b>Monitored application</b><div><code id="target"></code></div><p class="muted">A scan runs automatically when this page opens and every 60 seconds while it stays open.</p><button onclick="runAll()">Scan now</button><button onclick="recordShare()">I just shared — check contract</button><button onclick="recordToken()">Search gave no token</button></div>
<div id="summary" class="card">Starting QC scan…</div><div id="results"></div>
<h2>AI repair message</h2><textarea id="ticket" readonly></textarea><button onclick="copyTicket()">Copy repair message</button>
<script>
const APP='https://www-infinity4.github.io/C13b0/phi/';
const REPO_RAW='https://raw.githubusercontent.com/www-infinity4/C13b0/main/';
const results=document.getElementById('results'),ticket=document.getElementById('ticket'),summary=document.getElementById('summary');
document.getElementById('target').textContent=APP;
let findings=[];
function finding(contract,status,observed,expected,target,severity='high'){return {schema:'qc-phi-ticket/v1',contract,system:'Infinity Phi',status,severity,timestamp:new Date().toISOString(),expected,observed,inspectionTarget:target}}
function draw(x){const d=document.createElement('div');d.className='card '+(x.status==='pass'?'pass':x.status==='fail'?'fail':'warn');d.innerHTML='<b>'+x.contract+'</b><br>'+x.status.toUpperCase()+' — '+x.observed;results.appendChild(d)}
function compile(){const bad=findings.filter(x=>x.status!=='pass');summary.textContent=findings.length+' contracts checked · '+bad.length+' need attention';ticket.value=bad.length?JSON.stringify({schema:'qc-phi-handoff/v1',generatedAt:new Date().toISOString(),application:APP,repository:'www-infinity4/C13b0',failures:bad,repairRules:['Verify each failure on the deployed build before editing.','Trace trigger -> state/ledger -> destination/UI.','Make the smallest repair that restores the contract.','Preserve working search, cards, media, Collect, Share, wallet, feeds and navigation.','Rerun QC and related regression contracts after repair.']},null,2):'QC Phi found no failures in the checks it could run. Browser security can prevent cross-origin inspection; those checks are marked WARN rather than falsely passing.'}
async function probe(name,url,expected,target){try{const r=await fetch(url,{cache:'no-store'});const x=finding(name,r.ok?'pass':'fail','HTTP '+r.status,expected,target);findings.push(x);draw(x);return r}catch(e){const x=finding(name,'warn','Browser could not inspect: '+e.message,expected,target,'medium');findings.push(x);draw(x);return null}}
async function inspectSource(){try{const r=await fetch(REPO_RAW+'public/infinity-phi-result-tools.js',{cache:'no-store'});const s=await r.text();const checks=[
['Collection persistence',/phiShared:collection:v1/.test(s),'Shared collection key is present','public/infinity-phi-result-tools.js'],
['Current-search handoff',/infinityPhi:currentSearchCollection:v1/.test(s),'Current search collection handoff is present','public/infinity-phi-result-tools.js'],
['News Phi handoff',/News-Phi/.test(s),'News Phi destination is wired','public/infinity-phi-result-tools.js'],
['Website builder handoff',/Omni-Phi\/cards/.test(s),'Website builder destination is wired','public/infinity-phi-result-tools.js'],
['Search token hook',/(token|wallet|ledger|mint)/i.test(s),'Search-result layer contains a token/wallet/ledger hook so successful search can credit the wallet immediately','search success -> token ledger -> wallet refresh'],
['Share instrumentation',/(share|navigator\.share|twitter|x\.com)/i.test(s),'Result layer exposes or observes share behavior so QC can verify a completed share','share action -> shared state/event -> QC feed']
];for(const [n,ok,e,t] of checks){const x=finding(n,ok?'pass':'fail',ok?'Required wiring found in deployed source':'Required wiring not found in result-tools source',e,t);findings.push(x);draw(x)}}catch(e){const x=finding('Source contract scan','warn',e.message,'QC can read deployed source contracts','C13b0/public','medium');findings.push(x);draw(x)}}
async function runAll(){findings=[];results.replaceChildren();summary.textContent='Scanning…';await probe('Infinity Phi reachability',APP,'Infinity Phi returns HTTP success','C13b0 /phi route');await probe('News Phi reachability','https://www-infinity4.github.io/News-Phi/','News Phi destination returns HTTP success','News-Phi');await probe('Website builder reachability','https://www-infinity4.github.io/Omni-Phi/cards/','Website builder returns HTTP success','Omni-Phi/cards');await inspectSource();compile()}
function recordShare(){const x=finding('Share round-trip','fail','User completed a Share action but QC Phi received no share receipt/event and nothing appeared in the QC feed',['Share emits a durable receipt/event','QC Phi can read that receipt without manual data entry'],'Infinity Phi share handler -> QC Phi receipt/feed');findings.unshift(x);results.prepend((()=>{const d=document.createElement('div');d.className='card fail';d.innerHTML='<b>'+x.contract+'</b><br>FAIL — '+x.observed;return d})());compile()}
function recordToken(){const x=finding('Search token credit','fail','Search completed but wallet did not calculate/credit the search token',['one successful search creates one token transaction immediately','ledger persists it','wallet tally refreshes immediately'],'search success -> token mint/ledger -> wallet refresh');findings.unshift(x);draw(x);compile()}
async function copyTicket(){await navigator.clipboard.writeText(ticket.value)}
runAll();setInterval(runAll,60000);
</script></main></body></html>
